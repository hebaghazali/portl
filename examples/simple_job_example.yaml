# Simple Job DSL example - CSV read with context passing
# This demonstrates the new orchestration engine features

steps:
  # Step 1: Read CSV data
  - id: read_users
    type: csv.read
    save_as: users
    path: ./examples/sample_data.csv
    delimiter: ","
    has_header: true
  
  # Step 2: Read again (demonstrates context passing)
  - id: verify_users
    type: csv.read
    save_as: verified_users
    path: ./examples/sample_data.csv
    # This step will only execute if first step succeeded
    # Context from read_users is available via: {{ steps.read_users.rows }}

