name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -e .
    
    - name: Run unit tests (no DB required)
      run: |
        pytest tests/test_templating_security.py \
               tests/test_job_engine.py \
               tests/test_field_mapping.py \
               tests/test_conditional_executor.py \
               tests/test_lambda_executor.py \
               -v --tb=short
    
    - name: Run CLI tests
      run: |
        pytest tests/test_cli.py -v --tb=short

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: portl_test
          POSTGRES_PASSWORD: portl_test
          POSTGRES_DB: portl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: portl_test
          MYSQL_DATABASE: portl_test
          MYSQL_USER: portl_test
          MYSQL_PASSWORD: portl_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    env:
      PORTL_TEST_PG_HOST: localhost
      PORTL_TEST_PG_PORT: 5432
      PORTL_TEST_PG_USER: portl_test
      PORTL_TEST_PG_PASSWORD: portl_test
      PORTL_TEST_PG_DATABASE: portl_test
      PORTL_TEST_MYSQL_HOST: localhost
      PORTL_TEST_MYSQL_PORT: 3306
      PORTL_TEST_MYSQL_USER: portl_test
      PORTL_TEST_MYSQL_PASSWORD: portl_test
      PORTL_TEST_MYSQL_DATABASE: portl_test
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -e .
    
    - name: Initialize test database
      run: |
        PGPASSWORD=portl_test psql -h localhost -U portl_test -d portl_test -f tests/fixtures/init.sql
    
    - name: Run database integration tests
      run: |
        pytest tests/test_db_executors.py \
               tests/test_postgres_connector.py \
               tests/test_mysql_connector.py \
               tests/test_compensation.py \
               tests/test_outbox.py \
               tests/test_sql_from_file.py \
               -v --tb=short
    
    - name: Run E2E flow tests
      run: |
        pytest tests/test_e2e_flows.py -v --tb=short

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -e .
    
    - name: Run performance tests
      run: |
        pytest tests/test_performance.py -v --tb=short --durations=10

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: portl_test
          POSTGRES_PASSWORD: portl_test
          POSTGRES_DB: portl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    env:
      PORTL_TEST_PG_HOST: localhost
      PORTL_TEST_PG_PORT: 5432
      PORTL_TEST_PG_USER: portl_test
      PORTL_TEST_PG_PASSWORD: portl_test
      PORTL_TEST_PG_DATABASE: portl_test
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -e .
    
    - name: Initialize test database
      run: |
        PGPASSWORD=portl_test psql -h localhost -U portl_test -d portl_test -f tests/fixtures/init.sql
    
    - name: Run tests with coverage
      run: |
        pytest tests/ -v --cov=src/portl --cov-report=xml --cov-report=term-missing
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        fail_ci_if_error: false
        verbose: true

